<div class="form-group {{ class }}">
  {% if label %}<label class="form-label" for="{{ id }}">{{ label }}</label>{% endif %}
  <input type="{{ type|default:'text' }}" name="{{ name }}" id="{{ id }}" value="{{ value|default:'' }}" class="form-control {% if errors %}is-invalid{% endif %}" placeholder="{{ placeholder }}" {% if required %}required{% endif %} {{ attrs }} />
  {% if errors %}
    {% for error in errors %}
      <div class="form-error">{{ error }}</div>
    {% endfor %}
  {% endif %}
</div>
