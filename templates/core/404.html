{% extends "base.html" %}
{% block title %}404 — Page Not Found | ShopGPT{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in" style="text-align:center; max-width:520px;">
    <div style="font-size:5rem; margin-bottom:1rem; line-height:1;">404</div>
    <h1 style="font-size:1.75rem; margin-bottom:0.75rem;" class="gradient-text">Page Not Found</h1>
    <p class="text-muted" style="margin-bottom:2rem; font-size:0.95rem;">
      The page you're looking for doesn't exist or may have been moved. Let's get you back on track.
    </p>
    <div class="flex flex-col gap-3">
      <a href="{% url 'home' %}" class="btn btn-primary btn-lg">🏠 Go Home</a>
      <a href="javascript:history.back()" class="btn btn-outline">← Go Back</a>
    </div>
  </div>
</div>
{% endblock %}
