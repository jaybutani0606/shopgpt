{% extends "base.html" %}
{% block title %}Password Reset Complete — ShopGPT{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in" style="text-align:center">
    <span style="font-size:3rem;display:block;margin-bottom:1rem">✅</span>
    <h1 class="auth-card__title">Password Updated!</h1>
    <p style="color:var(--text-muted);margin-bottom:2rem">Your password has been changed successfully. You can now log in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-full btn-lg">Log In Now</a>
  </div>
</div>
{% endblock %}
