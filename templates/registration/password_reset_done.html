{% extends "base.html" %}
{% block title %}Check Your Email — ShopGPT{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in" style="text-align:center">
    <span style="font-size:3rem;display:block;margin-bottom:1rem">📧</span>
    <h1 class="auth-card__title">Check your email</h1>
    <p style="color:var(--text-muted);margin-bottom:2rem">If an account exists with that email, you'll receive a password reset link shortly.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-full">Return to Login</a>
  </div>
</div>
{% endblock %}
