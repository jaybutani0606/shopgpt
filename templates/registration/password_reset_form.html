{% extends "base.html" %}
{% block title %}Reset Password — ShopGPT{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card fade-in">
    <div class="auth-card__logo"><span style="font-size:2.5rem">🔑</span></div>
    <h1 class="auth-card__title">Reset Password</h1>
    <p class="auth-card__subtitle">Enter your email and we'll send a reset link</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_email">Email Address</label>
        <input id="id_email" class="form-control" type="email" name="email" placeholder="you@example.com" required />
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg">Send Reset Link</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem">
      <a href="{% url 'accounts:login' %}" style="color:var(--text-dim)">← Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
